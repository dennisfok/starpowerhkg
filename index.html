<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarPower HKG · 車隊管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<style>
:root{--primary:#1a1a2e;--accent:#e94560;--gold:#f5a623;--success:#27ae60;--bg:#0f0f1a;--card:#1e1e30;--border:#2d2d45;--text:#e0e0f0;--muted:#8888aa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:420px;width:100%}
.login-box h1{font-size:1.8rem;margin-bottom:6px}
.login-box .sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.logo-big{font-size:2.5rem;margin-bottom:16px}
.tab-row{display:flex;gap:4px;margin-bottom:24px;background:var(--bg);padding:4px;border-radius:8px}
.tab-btn{flex:1;padding:8px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:.85rem;font-weight:600}
.tab-btn.active{background:var(--card);color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:.9rem}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.error-msg{color:var(--accent);font-size:.85rem;margin-bottom:12px;display:none}
#setup-screen{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.setup-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:480px;width:100%}
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.topbar-logo{font-weight:700;font-size:1.1rem;color:var(--gold)}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-badge{font-size:.78rem;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:20px}
.nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;gap:4px;padding:0 12px;scrollbar-width:none;position:sticky;top:56px;z-index:99}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:12px 16px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.content{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer}
.card.vip{border-left:3px solid var(--gold)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-meta{color:var(--muted);font-size:.8rem;margin-top:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:.72rem;font-weight:600;text-transform:uppercase}
.badge-vip{background:rgba(245,166,35,.15);color:var(--gold)}
.badge-pending{background:rgba(100,100,200,.15);color:#aab}
.badge-confirmed{background:rgba(39,174,96,.15);color:#2ecc71}
.badge-completed{background:rgba(39,174,96,.25);color:#27ae60}
.badge-cancelled{background:rgba(233,69,96,.15);color:var(--accent)}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:640px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-val{font-size:1.6rem;font-weight:700;color:var(--gold)}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:4px}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-gold{background:var(--gold);color:#000}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-imessage{background:#007AFF;color:#fff}
.btn-danger{background:rgba(233,69,96,.15);color:var(--accent);border:1px solid var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:20px}
@media(min-width:640px){.modal-overlay{align-items:center}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px}
@media(min-width:640px){.modal{border-radius:16px}}
.modal-title{font-size:1.2rem;font-weight:700;margin-bottom:20px}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:.9rem}
.booking-route{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.88rem}
.booking-route .from,.booking-route .to{flex:1}
.booking-route .arrow{color:var(--muted);flex-shrink:0}
.booking-info-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.booking-info-item{font-size:.8rem;color:var(--muted)}
.booking-info-item span{color:var(--text);font-weight:500}
.booking-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.internal-code{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--gold);background:rgba(245,166,35,.1);padding:2px 8px;border-radius:4px}
.driver-card{display:flex;align-items:center;gap:14px}
.driver-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0}
.profit-positive{color:#2ecc71;font-weight:600}
.profit-negative{color:var(--accent);font-weight:600}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:var(--muted)}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.detail-row:last-child{border-bottom:none}
.detail-key{color:var(--muted)}
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:.8rem;white-space:nowrap}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.tag-lead{background:rgba(245,166,35,.2);color:var(--gold);padding:2px 6px;border-radius:4px;font-size:.72rem}
.driver-my-bookings{background:rgba(245,166,35,.05);border:1px solid rgba(245,166,35,.2);border-radius:12px;padding:16px;margin-bottom:12px}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="logo-big">⭐</div>
    <h1>StarPower HKG</h1>
    <div class="sub">車隊管理系統</div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchLoginTab('admin')">管理員</button>
      <button class="tab-btn" onclick="switchLoginTab('driver')">司機</button>
    </div>
    <div id="admin-login">
      <div class="form-group">
        <label>用戶名</label>
        <input type="text" id="admin-user" placeholder="starpower">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="admin-pass" placeholder="••••••••">
      </div>
    </div>
    <div id="driver-login" style="display:none">
      <div class="form-group">
        <label>車牌號碼</label>
        <input type="text" id="driver-plate" placeholder="例：LV944">
      </div>
      <div class="form-group">
        <label>手機號碼（含國碼）</label>
        <input type="text" id="driver-phone" placeholder="例：+85298034040">
      </div>
    </div>
    <div class="error-msg" id="login-error">用戶名或密碼錯誤</div>
    <button class="btn btn-gold" style="width:100%;padding:14px;margin-top:8px" onclick="doLogin()">登入 →</button>
  </div>
</div>

<div id="setup-screen">
  <div class="setup-box">
    <div class="logo-big">🔧</div>
    <h1>首次設定</h1>
    <p style="color:var(--muted);margin-bottom:24px;font-size:.9rem">請輸入 Supabase 連接資料</p>
    <div class="form-group">
      <label>Supabase Project URL</label>
      <input type="text" id="setup-url" placeholder="https://xxxxxx.supabase.co">
    </div>
    <div class="form-group">
      <label>Supabase Anon Public Key</label>
      <input type="password" id="setup-key" placeholder="eyJhbGciOiJ...">
    </div>
    <button class="btn btn-gold" style="width:100%;padding:14px" onclick="saveSetup()">儲存設定 →</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">⭐ StarPower HKG</div>
    <div class="topbar-right">
      <span class="user-badge" id="user-badge"></span>
      <button class="btn btn-sm btn-ghost" onclick="showTab('search')" id="search-btn">🔍</button>
      <button class="btn btn-sm btn-primary" onclick="openNewBooking()" id="new-booking-btn">+ 新單</button>
      <button class="btn btn-sm btn-ghost" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="showTab('dashboard')">📊 總覽</button>
    <button class="nav-btn" onclick="showTab('bookings')">📋 訂單</button>
    <button class="nav-btn admin-only" onclick="showTab('drivers')">👤 司機</button>
    <button class="nav-btn admin-only" onclick="showTab('cashflow')">💰 現金流</button>
    <button class="nav-btn" onclick="showTab('search')">🔍 搜尋</button>
  </div>
  <div class="content" id="main-content"></div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script>
// ─── CONFIG ───────────────────────────────────
let SUPABASE_URL=localStorage.getItem('sp_url')||'';
let SUPABASE_KEY=localStorage.getItem('sp_key')||'';
let currentUser=null;
let currentRole=null;
let currentDriverId=null;
let platforms=[],drivers=[];

const ADMIN_USERS=[{user:'starpower',pass:'YX577lv944'}];

// ─── INIT ─────────────────────────────────────
window.onload=()=>{
  if(!SUPABASE_URL||!SUPABASE_KEY){
    document.getElementById('setup-screen').style.display='flex';
  } else {
    document.getElementById('login-screen').style.display='flex';
  }
};

function saveSetup(){
  const url=document.getElementById('setup-url').value.trim();
  const key=document.getElementById('setup-key').value.trim();
  if(!url||!key)return alert('請填寫所有欄位');
  SUPABASE_URL=url;SUPABASE_KEY=key;
  localStorage.setItem('sp_url',url);
  localStorage.setItem('sp_key',key);
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function switchLoginTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['admin','driver'][i]===tab));
  document.getElementById('admin-login').style.display=tab==='admin'?'block':'none';
  document.getElementById('driver-login').style.display=tab==='driver'?'block':'none';
}

async function doLogin(){
  const err=document.getElementById('login-error');
  err.style.display='none';
  const adminTab=document.getElementById('admin-login').style.display!=='none';

  if(adminTab){
    const user=document.getElementById('admin-user').value.trim();
    const pass=document.getElementById('admin-pass').value;
    const match=ADMIN_USERS.find(a=>a.user===user&&a.pass===pass);
    if(!match){err.style.display='block';return;}
    currentUser=user;currentRole='admin';currentDriverId=null;
    await launchApp();
  } else {
    const plate=document.getElementById('driver-plate').value.trim().toUpperCase();
    const phone=document.getElementById('driver-phone').value.trim();
    if(!plate||!phone){err.textContent='請填寫車牌同電話';err.style.display='block';return;}
    try{
      await apiInit();
      const res=await api(`drivers?license_plate=eq.${encodeURIComponent(plate)}&phone=eq.${encodeURIComponent(phone)}&select=*`);
      if(!res.length){err.textContent='車牌或電話唔啱，請重試';err.style.display='block';return;}
      currentUser=res[0].name;currentRole='driver';currentDriverId=res[0].id;
      await launchApp();
    }catch(e){err.textContent='登入失敗：'+e.message;err.style.display='block';}
  }
}

async function launchApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('user-badge').textContent=currentRole==='admin'?'👑 '+currentUser:'🚗 '+currentUser;
  document.getElementById('new-booking-btn').style.display=currentRole==='admin'?'':'none';
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=currentRole==='admin'?'':'none');
  await apiInit();
  await loadMasterData();
  showTab('dashboard');
}

function doLogout(){
  currentUser=null;currentRole=null;currentDriverId=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('admin-user').value='';
  document.getElementById('admin-pass').value='';
  document.getElementById('driver-plate').value='';
  document.getElementById('driver-phone').value='';
}

// ─── API ──────────────────────────────────────
async function apiInit(){
  if(!SUPABASE_URL||!SUPABASE_KEY)throw new Error('未設定 Supabase');
}

async function api(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);
  if(!r.ok){const e=await r.text();throw new Error(e)}
  const t=await r.text();return t?JSON.parse(t):[];
}

async function loadMasterData(){
  try{
    platforms=await api('platforms?select=*&order=name');
    drivers=await api('drivers?select=*&order=name');
  }catch(e){console.error(e)}
}

// ─── TABS ─────────────────────────────────────
function showTab(tab){
  if(currentRole==='driver'&&(tab==='drivers'||tab==='cashflow'))return;
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active',['dashboard','bookings','drivers','cashflow','search'][i]===tab);
  });
  document.getElementById('main-content').innerHTML='<div class="loading">載入中...</div>';
  if(tab==='dashboard')renderDashboard();
  else if(tab==='bookings')renderBookings();
  else if(tab==='drivers')renderDrivers();
  else if(tab==='cashflow')renderCashflow();
  else if(tab==='search')renderSearch();
}

// ─── DASHBOARD ────────────────────────────────
async function renderDashboard(){
  try{
    let bookingsQuery='bookings?select=*,drivers(*),platforms(*)&order=booking_date.desc,pickup_time.desc&limit=5';
    let allQuery='bookings?select=*';
    if(currentRole==='driver'){
      bookingsQuery+=`&assigned_driver_id=eq.${currentDriverId}`;
      allQuery+=`&assigned_driver_id=eq.${currentDriverId}`;
    }
    const [bookings,allBookings]=await Promise.all([api(bookingsQuery),api(allQuery)]);
    const totalPayout=allBookings.reduce((s,b)=>s+(b.platform_payout||0),0);
    const totalProfit=allBookings.reduce((s,b)=>s+(b.profit||0),0);
    const totalDriverPayout=allBookings.reduce((s,b)=>s+(b.driver_payout||0),0);
    const today=dayjs().format('YYYY-MM-DD');
    const todayCount=allBookings.filter(b=>b.booking_date===today).length;

    document.getElementById('main-content').innerHTML=`
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val">${allBookings.length}</div><div class="stat-label">📋 ${currentRole==='driver'?'我嘅單':'總訂單'}</div></div>
        <div class="stat-card"><div class="stat-val">${todayCount}</div><div class="stat-label">📅 今日訂單</div></div>
        ${currentRole==='admin'?`
        <div class="stat-card"><div class="stat-val">US$${totalPayout.toFixed(0)}</div><div class="stat-label">💳 總收入</div></div>
        <div class="stat-card"><div class="stat-val profit-positive">US$${totalProfit.toFixed(0)}</div><div class="stat-label">💰 總利潤</div></div>
        `:`
        <div class="stat-card"><div class="stat-val profit-positive">US$${totalDriverPayout.toFixed(0)}</div><div class="stat-label">💰 我嘅工資</div></div>
        <div class="stat-card"><div class="stat-val">${allBookings.filter(b=>b.status==='completed').length}</div><div class="stat-label">✅ 完成訂單</div></div>
        `}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="font-size:1rem">${currentRole==='driver'?'我嘅最近訂單':'最近訂單'}</h2>
        <button class="btn btn-ghost btn-sm" onclick="showTab('bookings')">全部 →</button>
      </div>
      ${bookings.map(b=>bookingCard(b)).join('')}
    `;
  }catch(e){
    document.getElementById('main-content').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

// ─── BOOKINGS ─────────────────────────────────
async function renderBookings(filter='all'){
  try{
    let query='bookings?select=*,drivers(*),platforms(*)&order=booking_date.desc,pickup_time.desc';
    if(currentRole==='driver')query+=`&assigned_driver_id=eq.${currentDriverId}`;
    const bookings=await api(query);
    const filtered=filter==='all'?bookings:filter==='vip'?bookings.filter(b=>b.vip):filter==='unassigned'?bookings.filter(b=>!b.assigned_driver_id):bookings.filter(b=>b.status===filter);

    const filters=currentRole==='admin'
      ?['all','pending','confirmed','completed','vip','unassigned']
      :['all','confirmed','completed'];

    document.getElementById('main-content').innerHTML=`
      <div class="filter-row">
        ${filters.map(f=>`
          <button class="filter-btn ${filter===f?'active':''}" onclick="renderBookings('${f}')">
            ${f==='all'?'全部':f==='pending'?'待確認':f==='confirmed'?'已確認':f==='completed'?'已完成':f==='vip'?'⭐ VIP':'未派司機'}
          </button>`).join('')}
      </div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:12px">${filtered.length} 張單</div>
      ${filtered.length?filtered.map(b=>bookingCard(b)).join(''):'<div class="empty"><div class="empty-icon">📋</div><p>冇訂單</p></div>'}
    `;
  }catch(e){document.getElementById('main-content').innerHTML=`<div class="empty"><p>錯誤：${e.message}</p></div>`}
}

function bookingCard(b){
  const profit=b.profit||(b.platform_payout-b.driver_payout);
  return `
    <div class="card ${b.vip?'vip':''}" onclick="viewBooking('${b.id}')">
      <div class="card-header">
        <div>
          <span class="internal-code">${b.internal_code||'—'}</span>
          ${b.vip?'<span class="badge badge-vip" style="margin-left:6px">⭐ VIP</span>':''}
          <div class="card-meta">${b.booking_date||''} ${b.pickup_time?b.pickup_time.slice(0,5):''} · ${b.vehicle_type||''}</div>
        </div>
        <span class="badge badge-${b.status||'pending'}">${statusLabel(b.status)}</span>
      </div>
      <div class="booking-route">
        <div class="from" style="font-size:.82rem">${b.pickup_location||'—'}</div>
        <div class="arrow">→</div>
        <div class="to" style="font-size:.82rem">${b.dropoff_location||'—'}</div>
      </div>
      <div class="booking-info-row">
        <div class="booking-info-item">👤 <span>${b.passenger_name||'—'}</span></div>
        <div class="booking-info-item">🚗 <span>${b.drivers?b.drivers.name:'未派'}</span></div>
        ${currentRole==='admin'?`<div class="booking-info-item">💳 <span>US$${b.platform_payout||0}</span></div><div class="booking-info-item profit-positive">💰 <span>+US$${profit||0}</span></div>`:`<div class="booking-info-item">💰 <span>US$${b.driver_payout||0}</span></div>`}
      </div>
      <div class="booking-actions" onclick="event.stopPropagation()">
        ${b.passenger_phone&&currentRole==='admin'?`
          <button class="btn btn-sm btn-whatsapp" onclick="whatsapp('${b.passenger_phone}','${(b.passenger_name||'').replace(/'/g,"\\'")}')">WhatsApp</button>
          <button class="btn btn-sm btn-imessage" onclick="imessage('${b.passenger_phone}')">iMessage</button>`:''}

async function saveBooking(id){
  const data={

    pickup_time:document.getElementById('f-time').value||null,
    platform_id:document.getElementById('f-platform').value||null,
    booking_ref:document.getElementById('f-ref').value||null,
    vehicle_type:document.getElementById('f-vehicle').value,
    pickup_location:document.getElementById('f-pickup').value,
    dropoff_location:document.getElementById('f-dropoff').value,
    flight_number:document.getElementById('f-flight').value||null,
    passenger_name:document.getElementById('f-pname').value,
    passenger_phone:document.getElementById('f-pphone').value||null,
    pax:parseInt(document.getElementById('f-pax').value)||1,
    luggage:parseInt(document.getElementById('f-luggage').value)||0,
    assigned_driver_id:document.getElementById('f-driver').value||null,
    platform_payout:parseFloat(document.getElementById('f-payout').value)||0,
    platform_gross:parseFloat(document.getElementById('f-gross').value)||0,
    driver_payout:parseFloat(document.getElementById('f-dpayout').value)||0,
    status:document.getElementById('f-status').value,
    vip:document.getElementById('f-vip').checked,
    notes:document.getElementById('f-notes').value||null,
    exchange_rate:parseFloat(document.getElementById('f-rate')?.value)||7.8,
driver_wage_market:parseFloat(document.getElementById('f-wage-market')?.value)||0,
driver_wage_paid:parseFloat(document.getElementById('f-wage-paid')?.value)||0,
wage_paid_by:document.getElementById('f-wage-paidby')?.value||null,
wage_paid_method:document.getElementById('f-wage-method')?.value||'cash',
referrer_id:document.getElementById('f-referrer')?.value||null,
referrer_bonus:Math.max(0,(parseFloat(document.getElementById('f-wage-paid')?.value)||0)-(parseFloat(document.getElementById('f-wage-market')?.value)||0)),

  };
  try{
    if(id)await api(`bookings?id=eq.${id}`,'PATCH',data);
    else await api('bookings','POST',data);
    closeModal();renderBookings();
  }catch(e){alert('儲存失敗：'+e.message)}
}

    </div>
    <div class="form-group"><label>備註</label><textarea id="cf-notes"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" style="flex:1" onclick="saveCashflow()">💾 儲存</button>
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    </div>
  `);
}

async function saveCashflow(){
  const data={
    type:document.getElementById('cf-type').value,
    amount:parseFloat(document.getElementById('cf-amount').value)||0,
    booking_id:document.getElementById('cf-booking').value||null,
    paid_by:document.getElementById('cf-from').value||null,
    paid_to:document.getElementById('cf-to').value||null,
    payment_method:document.getElementById('cf-method').value,
    notes:document.getElementById('cf-notes').value||null,
  };
  try{await api('cashflow','POST',data);closeModal();renderCashflow();}
  catch(e){alert('儲存失敗：'+e.message)}
}

function renderSearch(){
  document.getElementById('main-content').innerHTML=`
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="SP-0001、客人名、電話..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-primary" onclick="doSearch()">搜尋</button>
    </div>
    <div id="search-results"></div>
  `;
  setTimeout(()=>document.getElementById('search-input')?.focus(),100);
}

async function doSearch(){
  const q=document.getElementById('search-input').value.trim();
  if(!q)return;
  const res=document.getElementById('search-results');
  res.innerHTML='<div class="loading">搜尋中...</div>';
  try{
    let query=`bookings?select=*,drivers(*),platforms(*)&or=(internal_code.ilike.*${encodeURIComponent(q)}*,passenger_name.ilike.*${encodeURIComponent(q)}*,passenger_phone.ilike.*${encodeURIComponent(q)}*,booking_ref.ilike.*${encodeURIComponent(q)}*,pickup_location.ilike.*${encodeURIComponent(q)}*,dropoff_location.ilike.*${encodeURIComponent(q)}*)&order=booking_date.desc`;
    if(currentRole==='driver')query+=`&assigned_driver_id=eq.${currentDriverId}`;
    const results=await api(query);
    res.innerHTML=results.length?
      `<div style="color:var(--muted);font-size:.82rem;margin-bottom:12px">找到 ${results.length} 張單</div>`+results.map(b=>bookingCard(b)).join(''):
      '<div class="empty"><div class="empty-icon">🔍</div><p>冇結果</p></div>';
  }catch(e){res.innerHTML=`<div class="empty"><p>錯誤：${e.message}</p></div>`}
}

  const clean=phone.replace(/[^0-9+]/g,'');
  const msg=encodeURIComponent(`你好 ${name}，\n\n我哋係 StarPower HKG，請問你嘅行程：\n• 幾多人同行？\n• 有幾多件行李？\n• 有冇特別要求？\n\n多謝！`);

}

function whatsappDriver(phone){
  window.open(`https://wa.me/${phone.replace(/[^0-9+]/g,'')}`, '_blank');
}

function imessage(phone){
  window.open(`sms:${phone.replace(/[^0-9+]/g,'')}`, '_blank');
}

function showModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').style.display='flex';
}

  function updateProfitCalc(){
  const payout=parseFloat(document.getElementById('f-payout')?.value)||0;
  const rate=parseFloat(document.getElementById('f-rate')?.value)||7.8;
  const wageMarket=parseFloat(document.getElementById('f-wage-market')?.value)||0;
  const wagePaid=parseFloat(document.getElementById('f-wage-paid')?.value)||0;
  const payoutHKD=(payout*rate).toFixed(2);
  const referrerBonus=Math.max(0,(wagePaid-wageMarket)).toFixed(2);
  const profit=(payout*rate-wagePaid).toFixed(2);
  const hkdEl=document.getElementById('f-payout-hkd');
  const bonusEl=document.getElementById('f-referrer-bonus');
  const profitEl=document.getElementById('f-profit-display');
  const breakdownEl=document.getElementById('f-profit-breakdown');
  if(hkdEl)hkdEl.value=`HK$${payoutHKD}`;
  if(bonusEl)bonusEl.value=`HK$${referrerBonus}`;
  if(profitEl){
    profitEl.textContent=`HK$${profit}`;
    profitEl.style.color=parseFloat(profit)>=0?'#2ecc71':'#e94560';
  }
  if(breakdownEl)breakdownEl.textContent=`HK$${payoutHKD} - HK$${wagePaid} = HK$${profit}`;
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').style.display='none';
}

function resetSetup(){
  localStorage.removeItem('sp_url');
  localStorage.removeItem('sp_key');
  location.reload();
}
</script>
